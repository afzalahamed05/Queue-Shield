apiVersion: apps/v1
kind: Deployment
metadata:
  name: queueshield-frontend
  labels: {{- include "queueshield.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: queueshield-frontend }
  template:
    metadata:
      labels: { app: queueshield-frontend }
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: API_BASE_URL
              value: {{ .Values.frontend.apiBaseUrl | quote }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources: {{- .Values.resources.light | toYaml | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: queueshield-frontend
  labels: {{- include "queueshield.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: { app: queueshield-frontend }
  ports:
    - port: 80
      targetPort: 80
      nodePort: {{ .Values.frontend.nodePort }}
