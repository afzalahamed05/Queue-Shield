{{- range .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
    {{- include "queueshield.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .name }} }
  template:
    metadata:
      labels: { app: {{ .name }} }
    spec:
      containers:
        - name: {{ .name }}
          image: {{ .image }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .port }}
          env:
            - name: SERVER_PORT
              value: {{ .port | quote }}
            {{- if .db }}
            - name: DB_URL
              value: "jdbc:postgresql://queueshield-postgres:5432/{{ .db }}"
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: {{ $.Values.dbSecretName }}, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $.Values.dbSecretName }}, key: password } }
            {{- end }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: {{ .port }} }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: {{ .port }} }
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 6
          resources: {{- $.Values.resources.jvm | toYaml | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
    {{- include "queueshield.labels" $ | nindent 4 }}
spec:
  type: {{ if .nodePort }}NodePort{{ else }}ClusterIP{{ end }}
  selector: { app: {{ .name }} }
  ports:
    - port: {{ .port }}
      targetPort: {{ .port }}
      {{- if .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
---
{{- end }}
