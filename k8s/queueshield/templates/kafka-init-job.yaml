apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  labels: {{- include "queueshield.labels" . | nindent 4 }}
  annotations:
    # a fresh Job per install/upgrade, since Jobs are immutable once created
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kafka-init
          image: {{ .Values.kafka.image }}
          command:
            - /bin/sh
            - -c
            - |
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1; do
                echo "waiting for kafka..."; sleep 3;
              done
              {{- range .Values.kafka.topics }}
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 \
                --partitions 3 --replication-factor 1 --topic {{ . }}
              {{- end }}
