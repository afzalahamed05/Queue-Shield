spring:
  datasource:
    url: jdbc:h2:mem:assignment-service-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >-
          resourceRequestedEvent:com.queueshield.assignmentservice.event.ResourceRequestedEvent,
          assignmentCompletedEvent:com.queueshield.assignmentservice.event.AssignmentCompletedEvent
    consumer:
      group-id: assignment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.queueshield.assignmentservice.event
        spring.json.type.mapping: >-
          resourceAssignedEvent:com.queueshield.assignmentservice.event.ResourceAssignedEvent,
          resourceRequestRejectedEvent:com.queueshield.assignmentservice.event.ResourceRequestRejectedEvent

responder-service:
  base-url: ${RESPONDER_SERVICE_URL:http://responder-service:8086}

resource-service:
  base-url: ${RESOURCE_SERVICE_URL:http://resource-service:8085}

logging:
  level:
    com.queueshield: INFO
    org.apache.kafka: WARN
