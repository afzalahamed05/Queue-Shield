spring:
  application:
    name: gateway

  data:
    redis:
      host: ${REDIS_HOST:queueshield-redis}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      # Order matters: the first matching route wins. The rate-limited POST route for incident
      # creation must come before the general incident-service catch-all, or every request would
      # match the catch-all first and never see the limiter.
      routes:
        - id: incident-create-rate-limited
          uri: ${INCIDENT_SERVICE_URL:http://incident-service:8083}
          predicates:
            - Path=/api/incidents
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@clientIpKeyResolver}"

        - id: incident-service
          uri: ${INCIDENT_SERVICE_URL:http://incident-service:8083}
          predicates:
            - Path=/api/incidents/**

        - id: priority-service
          uri: ${PRIORITY_SERVICE_URL:http://priority-service:8084}
          predicates:
            - Path=/api/priorities/**

        - id: resource-service
          uri: ${RESOURCE_SERVICE_URL:http://resource-service:8085}
          predicates:
            - Path=/api/resources/**

        - id: responder-service
          uri: ${RESPONDER_SERVICE_URL:http://responder-service:8086}
          predicates:
            - Path=/api/responders/**

        - id: shelter-service
          uri: ${SHELTER_SERVICE_URL:http://shelter-service:8087}
          predicates:
            - Path=/api/shelters/**

        - id: assignment-service
          uri: ${ASSIGNMENT_SERVICE_URL:http://assignment-service:8088}
          predicates:
            - Path=/api/assignments/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8089}
          predicates:
            - Path=/api/notifications/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:4201"
              # kind's frontend NodePort mapping (k8s/kind-cluster.yaml) - the K8s deployment's
              # equivalent of 4200 above, kept separate since both stacks can run side by side.
              - "http://localhost:9180"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

server:
  port: ${SERVER_PORT:8090}

logging:
  level:
    com.queueshield: ${LOG_LEVEL:INFO}
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
