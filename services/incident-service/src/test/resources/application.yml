spring:
  datasource:
    url: jdbc:h2:mem:incident-service-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >-
          incidentEvent:com.queueshield.incidentservice.event.IncidentEvent
    consumer:
      group-id: incident-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.queueshield.incidentservice.event
        spring.json.type.mapping: >-
          incidentPrioritizedEvent:com.queueshield.incidentservice.event.IncidentPrioritizedEvent
        spring.json.value.default.type: com.queueshield.incidentservice.event.IncidentPrioritizedEvent

logging:
  level:
    com.queueshield: INFO
    org.apache.kafka: WARN
