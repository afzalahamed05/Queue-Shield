spring:
  datasource:
    url: jdbc:h2:mem:notification-service-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    # Production notification-service never publishes anything - this producer config exists only
    # so tests can publish synthetic upstream events using the same type aliases the real
    # producing services (priority-service, assignment-service, resource-service, shelter-service) use.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >-
          incidentPrioritizedEvent:com.queueshield.notificationservice.event.IncidentPrioritizedEvent,
          assignmentCompletedEvent:com.queueshield.notificationservice.event.AssignmentCompletedEvent,
          resourceRequestRejectedEvent:com.queueshield.notificationservice.event.ResourceRequestRejectedEvent,
          shelterCapacityChangedEvent:com.queueshield.notificationservice.event.ShelterCapacityChangedEvent
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.queueshield.notificationservice.event
        spring.json.type.mapping: >-
          incidentPrioritizedEvent:com.queueshield.notificationservice.event.IncidentPrioritizedEvent,
          assignmentCompletedEvent:com.queueshield.notificationservice.event.AssignmentCompletedEvent,
          resourceRequestRejectedEvent:com.queueshield.notificationservice.event.ResourceRequestRejectedEvent,
          shelterCapacityChangedEvent:com.queueshield.notificationservice.event.ShelterCapacityChangedEvent

logging:
  level:
    com.queueshield: INFO
    org.apache.kafka: WARN
