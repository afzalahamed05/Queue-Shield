spring:
  application:
    name: notification-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://queueshield-postgres:5432/notification_db}
    username: ${DB_USERNAME:queueshield}
    password: ${DB_PASSWORD:queueshield}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.queueshield.notificationservice.event
        spring.json.type.mapping: >-
          incidentPrioritizedEvent:com.queueshield.notificationservice.event.IncidentPrioritizedEvent,
          assignmentCompletedEvent:com.queueshield.notificationservice.event.AssignmentCompletedEvent,
          resourceRequestRejectedEvent:com.queueshield.notificationservice.event.ResourceRequestRejectedEvent,
          shelterCapacityChangedEvent:com.queueshield.notificationservice.event.ShelterCapacityChangedEvent

server:
  port: ${SERVER_PORT:8089}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.queueshield: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
