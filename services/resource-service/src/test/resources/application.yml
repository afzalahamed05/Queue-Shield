spring:
  datasource:
    url: jdbc:h2:mem:resource-service-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: ${REDIS_HOST:queueshield-redis}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >-
          resourceAssignedEvent:com.queueshield.resourceservice.event.ResourceAssignedEvent,
          resourceRequestRejectedEvent:com.queueshield.resourceservice.event.ResourceRequestRejectedEvent
    consumer:
      group-id: resource-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.queueshield.resourceservice.event
        spring.json.type.mapping: >-
          resourceRequestedEvent:com.queueshield.resourceservice.event.ResourceRequestedEvent
        spring.json.value.default.type: com.queueshield.resourceservice.event.ResourceRequestedEvent

logging:
  level:
    com.queueshield: INFO
    org.apache.kafka: WARN
