[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/local/bin/python3

[windows]
# host.docker.internal, not localhost/127.0.0.1 - this playbook runs inside the ansible container,
# so it has to reach out to the Windows host machine, not itself.
windows-host ansible_host=host.docker.internal

[windows:vars]
ansible_connection=winrm
ansible_winrm_transport=basic
ansible_winrm_scheme=http
ansible_port=5985
# Never commit a real password. Set it in the shell that runs the playbook:
#   $env:WINRM_PASSWORD = "..."   (PowerShell)  |  export WINRM_PASSWORD=...  (bash)
# and pass -e ansible_user=<your-windows-username> on the ansible-playbook command line.
ansible_password="{{ lookup('env', 'WINRM_PASSWORD') }}"
