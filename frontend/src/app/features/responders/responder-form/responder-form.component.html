<div class="page">
  <div class="page-header">
    <h1>{{ isEditMode() ? 'Edit Responder' : 'Add Responder' }}</h1>
  </div>

  @if (error()) {
    <div class="error-banner">{{ error() }}</div>
  }

  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label>Name *</label>
      <input type="text" formControlName="name" placeholder="e.g. Unit 7" />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <span class="field-error">Name is required.</span>
      }
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Role *</label>
        <select formControlName="role">
          @for (r of roleOptions; track r) {
            <option [value]="r">{{ r }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select formControlName="status">
          @for (s of statusOptions; track s) {
            <option [value]="s">{{ s }}</option>
          }
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Phone *</label>
        <input type="text" formControlName="phone" placeholder="e.g. 555-0100" />
      </div>
      <div class="form-group">
        <label>Current Location</label>
        <input type="text" formControlName="currentLocation" placeholder="e.g. Station 3" />
      </div>
    </div>

    <div style="display:flex; gap: 8px;">
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        {{ saving() ? 'Saving...' : 'Save Responder' }}
      </button>
      <a class="btn" routerLink="/responders">Cancel</a>
    </div>
  </form>
</div>
