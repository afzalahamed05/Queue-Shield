<div class="page">
  <div class="page-header">
    <h1>{{ isEditMode() ? 'Edit Shelter' : 'Add Shelter' }}</h1>
  </div>

  @if (error()) {
    <div class="error-banner">{{ error() }}</div>
  }

  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label>Name *</label>
      <input type="text" formControlName="name" />
      <span class="field-hint">e.g. "Central High School Shelter"</span>
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <span class="field-error">Name is required.</span>
      }
    </div>

    <div class="form-group">
      <label>Address *</label>
      <input type="text" formControlName="address" />
      <span class="field-hint">e.g. "100 Main St"</span>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Capacity Total *</label>
        <input type="number" formControlName="capacityTotal" min="0" />
      </div>
      <div class="form-group">
        <label>Capacity Occupied</label>
        <input type="number" formControlName="capacityOccupied" min="0" />
      </div>
    </div>

    <div class="form-group">
      <label>Contact Phone *</label>
      <input type="text" formControlName="contactPhone" />
      <span class="field-hint">e.g. "555-0200"</span>
    </div>

    <div style="display:flex; gap: 8px;">
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        {{ saving() ? 'Saving...' : 'Save Shelter' }}
      </button>
      <a class="btn" routerLink="/shelters">Cancel</a>
    </div>
  </form>
</div>
