<div class="page">
  <div class="page-header">
    <h1>{{ isEditMode() ? 'Edit Resource' : 'Add Resource' }}</h1>
  </div>

  @if (error()) {
    <div class="error-banner">{{ error() }}</div>
  }

  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label>Name *</label>
      <input type="text" formControlName="name" />
      <span class="field-hint">e.g. "Ambulance Unit 4"</span>
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <span class="field-error">Name is required.</span>
      }
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Type *</label>
        <select formControlName="type">
          @for (t of typeOptions; track t) {
            <option [value]="t">{{ t }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label>Location *</label>
        <input type="text" formControlName="location" />
        <span class="field-hint">e.g. "Central Depot"</span>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Quantity Total *</label>
        <input type="number" formControlName="quantityTotal" min="0" />
      </div>
      <div class="form-group">
        <label>Quantity Available *</label>
        <input type="number" formControlName="quantityAvailable" min="0" />
      </div>
    </div>

    <div style="display:flex; gap: 8px;">
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        {{ saving() ? 'Saving...' : 'Save Resource' }}
      </button>
      <a class="btn" routerLink="/resources">Cancel</a>
    </div>
  </form>
</div>
