spring:
  datasource:
    url: jdbc:h2:mem:queueshield-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect

queueshield:
  cors:
    allowed-origins: http://localhost:4200

logging:
  level:
    com.queueshield: INFO
